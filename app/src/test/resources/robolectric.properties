# app/src/test/resources/robolectric.properties
# 全局钉死 Robolectric 使用的 Android SDK 版本，免得每个测试类都挂 @Config(sdk = [...])
#
# 为什么不是 compileSdk 的 37，也不是 targetSdk 的 36：
# - SDK 37 的 android-all jar 在 Robolectric 4.16.1 里还没有（37 支持要等 4.17 正式版）
# - SDK 36 的 android-all jar 是 Java 21 编译的，跑它要求测试 JVM >= 21，
#   而本项目的 toolchain 钉在 17（AGP 9.3 官方唯一背书的版本），直接报
#   "Android SDK 36 requires Java 21 (have Java 17)"
# - SDK 35 的 android-all 仍是 Java 17 字节码，是 17 环境下能用的最高版本
#
# 我们的单测只碰 Room / SQLite / 纯 Kotlin 逻辑，这些行为不随 SDK 版本变，用 35 测同样有效。
# 以后 toolchain 升到 21+ 时，把这里改回 36 即可。
sdk=35
