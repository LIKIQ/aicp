# gradle.properties
# AICP 全局构建参数
# - org.gradle.java.home 钉本机 JDK 17：AGP 9.3.2 官方兼容表只背书 JDK 17+，
#   本机默认的 JDK 25 没有任何 AGP 版本声明支持，换机器时改这一行即可
# - file.encoding 必须显式 UTF-8，否则 Windows 中文环境下源码/资源里的中文会乱码

org.gradle.java.home=F\:\\Android\\openjdk\\jdk-17.0.8.101-hotspot
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 项目路径 F:\github项目库\aicp 含中文，AGP 默认直接拒绝构建。
# 本项目无 NDK / native 代码，aapt2 与 KSP 走 UTF-8 路径实测可用，所以放开这道检查。
# 若后续出现 aapt2/R8/KSP 的路径类报错，第一件事就是把工程挪到纯 ASCII 目录，而不是继续加开关。
android.overridePathCheck=true
